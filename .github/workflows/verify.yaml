name: Verify

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:conventions
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build --file docker/server/server.Dockerfile .
      - run: docker build --file docker/website/website.Dockerfile .
