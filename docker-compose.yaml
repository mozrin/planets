name: planets

services:
  server:
    container_name: planets_server
    build:
      context: .
      dockerfile: docker/server/server.Dockerfile
      target: production
    restart: unless-stopped
    environment:
      DATA_DIRECTORY: /app/data
      BACKUP_DIRECTORY: /app/backups
    volumes:
      - server_data:/app/data
      - server_backups:/app/backups
    networks:
      - appnet

  website:
    container_name: planets_website
    build:
      context: .
      dockerfile: docker/website/website.Dockerfile
      target: production
    restart: unless-stopped
    networks:
      - appnet

  tunnel:
    container_name: planets_tunnel
    build:
      context: .
      dockerfile: docker/cloudflared/cloudflared.Dockerfile
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in the deployment environment.}
    depends_on:
      - website
      - server
    restart: unless-stopped
    networks:
      - appnet

# Deliberately no `ports:` declarations: traffic stays on Docker networks.
networks:
  appnet:
    # Private to this Compose project. Do not set `internal: true`: the tunnel
    # needs outbound connectivity to Cloudflare.
volumes:
  server_data:
  server_backups:
