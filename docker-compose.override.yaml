# Automatically used by `docker compose up` for local development.
# The existing `moznet` network must already be created by your Traefik stack.
services:
  tunnel:
    networks:
      - moznet

  server:
    build:
      target: development
    command: npm run dev
    environment:
      DATA_DIRECTORY: /app/data
    volumes:
      - ./server:/app/server
      - server_node_modules:/app/node_modules
      - server_data:/app/data
    networks:
      - moznet
    labels:
      - traefik.enable=true
      - traefik.docker.network=moznet
      - traefik.http.routers.mozrin-planets-api.rule=Host(`${TRAEFIK_HOST:-mozrin-planets.mozrin.com}`) && PathPrefix(`/api`)
      - traefik.http.routers.mozrin-planets-api.priority=100
      - traefik.http.routers.mozrin-planets-api.entrypoints=websecure
      - traefik.http.routers.mozrin-planets-api.tls=true
      - traefik.http.routers.mozrin-planets-api-tunnel.rule=Host(`${TRAEFIK_HOST:-mozrin-planets.mozrin.com}`) && PathPrefix(`/api`)
      - traefik.http.routers.mozrin-planets-api-tunnel.priority=101
      - traefik.http.routers.mozrin-planets-api-tunnel.entrypoints=web
      - traefik.http.routers.mozrin-planets-api-tunnel.service=mozrin-planets-api
      - traefik.http.services.mozrin-planets-api.loadbalancer.server.port=3000

  website:
    build:
      target: development
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./website:/app/website
      - ./docs:/app/docs:ro
      - website_node_modules:/app/node_modules
    networks:
      - moznet
    labels:
      - traefik.enable=true
      - traefik.docker.network=moznet
      - traefik.http.routers.mozrin-planets.rule=Host(`${TRAEFIK_HOST:-mozrin-planets.mozrin.com}`)
      - traefik.http.routers.mozrin-planets.priority=1
      - traefik.http.routers.mozrin-planets.entrypoints=websecure
      - traefik.http.routers.mozrin-planets.tls=true
      - traefik.http.routers.mozrin-planets-tunnel.rule=Host(`${TRAEFIK_HOST:-mozrin-planets.mozrin.com}`)
      - traefik.http.routers.mozrin-planets-tunnel.priority=2
      - traefik.http.routers.mozrin-planets-tunnel.entrypoints=web
      - traefik.http.routers.mozrin-planets-tunnel.service=mozrin-planets
      - traefik.http.services.mozrin-planets.loadbalancer.server.port=5173

networks:
  moznet:
    external: true

volumes:
  server_node_modules:
  website_node_modules:
  server_data:
